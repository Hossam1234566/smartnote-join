<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دعوة للانضمام — نوتة ذكية</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg,
        #6C63FF 0%,
        #7D75FF 50%,
        #A89BFF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    /* أيقونة داخل مربع بنفسجي فاتح */
    .icon-box {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      background: rgba(108, 99, 255, 0.15);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    h1 {
      color: #1A1A2E;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6B6B80;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    /* صندوق المعلومات — نفس تصميم التطبيق */
    .info-box {
      background: rgba(108, 99, 255, 0.08);
      border: 1px solid rgba(108, 99, 255, 0.15);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: right;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 15px;
    }

    .info-row .emoji { font-size: 18px; flex-shrink: 0; }

    .info-row .label {
      color: #6B6B80;
      font-size: 13px;
      flex-shrink: 0;
    }

    .info-row .value {
      color: #1A1A2E;
      font-weight: 700;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* الأزرار */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      background: #6C63FF;
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn:hover { background: #5A52E0; }

    .btn-outline {
      background: transparent;
      color: #6C63FF;
      border: 2px solid #6C63FF;
    }

    .btn-outline:hover {
      background: rgba(108, 99, 255, 0.08);
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 14px;
      line-height: 1.7;
    }

    /* التحميل */
    .loading { display: none; padding: 20px 0; }
    .loading.show { display: block; }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border: 4px solid rgba(108, 99, 255, 0.15);
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading p { color: #6B6B80; font-size: 14px; }

    .content.hide { display: none; }

    /* الخطأ */
    .error {
      display: none;
      padding: 20px;
      background: #FFE5E5;
      border-radius: 16px;
      color: #C00;
      font-size: 14px;
      line-height: 1.7;
    }

    .error.show { display: block; }
    .error .error-icon { font-size: 48px; display: block; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">📝</div>
    <h1>دعوة للانضمام</h1>
    <p class="subtitle">تم دعوتك للانضمام إلى نوتة جماعية</p>

    <div id="content" class="content">
      <div class="info-box">
        <div class="info-row">
          <span class="emoji">📖</span>
          <span class="label">النوتة:</span>
          <span class="value" id="noteName">جاري التحميل...</span>
        </div>
        <div class="info-row">
          <span class="emoji">👤</span>
          <span class="label">من:</span>
          <span class="value" id="senderName">...</span>
        </div>
      </div>

      <a id="openAppBtn" class="btn" href="#">🔓 فتح التطبيق والانضمام</a>
      <a id="playStoreBtn" class="btn btn-outline"
         href="https://play.google.com/store/apps/details?id=com.hossam_note_27.smart_note_27">
        ⬇️ تثبيت التطبيق
      </a>

      <p class="hint">
        💡 لو التطبيق مثبّت هيفتح تلقائياً<br>
        لو لأ، هتضغط "تثبيت التطبيق" وبعدها ترجع للينك تاني
      </p>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>⏳ جاري فتح التطبيق...</p>
    </div>

    <div id="error" class="error">
      <span class="error-icon">⚠️</span>
      <span id="errorText"></span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const noteId = params.get('noteId');
    const invId  = params.get('invId');
    const title  = params.get('title') || 'نوتة';
    const sender = params.get('from') || 'مستخدم';

    const contentEl = document.getElementById('content');
    const loadingEl = document.getElementById('loading');
    const errorEl   = document.getElementById('error');

    if (!noteId) {
      document.getElementById('errorText').textContent =
        'رابط غير صالح، تأكد من فتح اللينك الصحيح';
      errorEl.classList.add('show');
      contentEl.classList.add('hide');
    } else {
      document.getElementById('noteName').textContent =
        '"' + decodeURIComponent(title) + '"';
      document.getElementById('senderName').textContent =
        decodeURIComponent(sender);

      const deepLink = 'io.supabase.smartnote://join?noteId=' + noteId +
                       (invId ? '&invId=' + invId : '');

      document.getElementById('openAppBtn').href = deepLink;

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        loadingEl.classList.add('show');
        contentEl.classList.add('hide');

        let appOpened = false;
        const handleVisibilityChange = function() {
          if (document.hidden) appOpened = true;
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        setTimeout(function() {
          window.location.href = deepLink;
        }, 100);

        setTimeout(function() {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (!appOpened) {
            loadingEl.classList.remove('show');
            contentEl.classList.remove('hide');
            document.getElementById('openAppBtn').textContent =
              '🔓 حاول فتح التطبيق تاني';
          }
        }, 2500);
      }
    }
  </script>
</body>
</html>
