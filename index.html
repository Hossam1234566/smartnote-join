<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>انضم للنوتة — نوتة ذكية</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #6C63FF 0%, #4A47D4 100%);
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 40px 30px;
      text-align: center; max-width: 420px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon { font-size: 72px; margin-bottom: 16px; }
    h1 { color: #6C63FF; font-size: 26px; margin-bottom: 24px; }
    .info-box {
      background: #F5F5FF; border-radius: 16px; padding: 16px;
      margin-bottom: 24px; text-align: right;
    }
    .info-row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0; font-size: 15px;
    }
    .info-row .label { color: #888; font-size: 13px; }
    .info-row .value {
      color: #333; font-weight: 600; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn {
      display: block; width: 100%; padding: 16px;
      background: #6C63FF; color: #fff; text-decoration: none;
      border-radius: 14px; font-size: 16px; font-weight: bold;
      margin-bottom: 10px;
    }
    .btn-outline {
      background: transparent; color: #6C63FF;
      border: 2px solid #6C63FF;
    }
    .hint { font-size: 12px; color: #999; margin-top: 12px; line-height: 1.6; }
    .loading { display: none; text-align: center; padding: 20px 0; }
    .loading.show { display: block; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto;
      border: 4px solid #F0F0FF; border-top-color: #6C63FF;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .content.hide { display: none; }
    .error {
      display: none; padding: 16px; background: #FFE5E5;
      border-radius: 12px; color: #C00; font-size: 14px;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📝</div>
    <h1>نوتة ذكية</h1>

    <div id="content" class="content">
      <div class="info-box">
        <div class="info-row">
          <span>📖</span>
          <span class="label">النوتة:</span>
          <span class="value" id="noteName">جاري التحميل...</span>
        </div>
        <div class="info-row">
          <span>👤</span>
          <span class="label">من:</span>
          <span class="value" id="senderName">...</span>
        </div>
      </div>

      <a id="openAppBtn" class="btn" href="#">🔓 فتح التطبيق والانضمام</a>
      <a id="playStoreBtn" class="btn btn-outline"
         href="https://play.google.com/store/apps/details?id=YOUR_PACKAGE_ID">
        ⬇️ تثبيت التطبيق
      </a>

      <p class="hint">
        💡 لو التطبيق مثبّت هيفتح تلقائياً<br>
        لو لأ، هتضغط "تثبيت التطبيق" وبعدها ترجع للينك تاني
      </p>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>⏳ جاري فتح التطبيق...</p>
    </div>

    <div id="error" class="error"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const noteId = params.get('noteId');
    const invId  = params.get('invId');
    const title  = params.get('title') || 'نوتة';
    const sender = params.get('from') || 'مستخدم';

    if (!noteId) {
      document.getElementById('error').textContent = '⚠️ رابط غير صالح';
      document.getElementById('error').classList.add('show');
      document.getElementById('content').classList.add('hide');
    } else {
      document.getElementById('noteName').textContent = '"' + decodeURIComponent(title) + '"';
      document.getElementById('senderName').textContent = decodeURIComponent(sender);

      const deepLink = 'io.supabase.smartnote://join?noteId=' + noteId +
                       (invId ? '&invId=' + invId : '');

      document.getElementById('openAppBtn').href = deepLink;

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        document.getElementById('loading').classList.add('show');
        document.getElementById('content').classList.add('hide');
        window.location.href = deepLink;

        setTimeout(function() {
          document.getElementById('loading').classList.remove('show');
          document.getElementById('content').classList.remove('hide');
          document.getElementById('openAppBtn').textContent = '🔓 حاول فتح التطبيق تاني';
        }, 2500);
      }
    }
  </script>
</body>
</html>
